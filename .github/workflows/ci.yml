name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: selene src tests

      - name: Format
        run: stylua --check src tests

      - name: Test
        run: lune run tests/run.luau

      - name: Build plugin
        run: rojo build -o PlaytestLogger.rbxm

      - uses: actions/upload-artifact@v4
        with:
          name: PlaytestLogger.rbxm
          path: PlaytestLogger.rbxm
